plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.command'
version = '0.0.1-SNAPSHOT'
description = 'ToyVillage_server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    enabled = false
}

bootJar {
    archiveFileName = "toyvillage.jar"
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // DB
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // SMTP
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // AWS
    implementation platform('software.amazon.awssdk:bom:2.42.23')

    // S3
    implementation 'software.amazon.awssdk:s3'

    // Swagger (springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
    dependsOn 'validateMigrationVersions'
    useJUnitPlatform()
}

tasks.register('validateMigrationVersions') {
    group = 'verification'
    description = 'Rejects duplicate Flyway migration versions without connecting to a database.'

    def migrations = fileTree('src/main/resources/db/migration') {
        include '**/V*.sql'
    }
    inputs.files(migrations)

    doLast {
        def versions = migrations.files.groupBy { migration ->
            def match = migration.name =~ /^V([0-9]+(?:[._][0-9]+)*)__.+\.sql$/
            if (!match.matches()) {
                throw new GradleException("Invalid Flyway migration filename: ${migration.name}")
            }

            def parts = match.group(1).split(/[._]/).collect { new BigInteger(it) }
            while (parts.size() > 1 && parts.last() == BigInteger.ZERO) {
                parts.remove(parts.size() - 1)
            }
            parts.join('.')
        }
        def duplicates = versions.findAll { version, files -> files.size() > 1 }
        if (!duplicates.isEmpty()) {
            def details = duplicates.collect { version, files ->
                "V${version}: ${files.collect { it.name }.sort().join(', ')}"
            }.sort().join('\n')
            throw new GradleException("Duplicate Flyway migration versions:\n${details}")
        }
        logger.lifecycle("Validated ${versions.size()} unique Flyway migration versions.")
    }
}

tasks.named('bootJar') {
    dependsOn 'validateMigrationVersions'
}
